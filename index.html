<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h2>My Profile Statistics</h2>
    <p id="ageOutput"></p>
    <p id="hobbiesOutput"></p>

    <h2>Create/Update Profile</h2>
    <form id="profileForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>


        <br><br>

        <label for="birthYear">Birth Year:</label>
        <input type="number" id="birthYear" name="birthYear" required>
        <br><br>
        <button type="submit">Create/Update Profile</button>
    </form>


    <h2>Hobbies</h2>
    <ul id="hobbiesList">
        <li>Coding</li>
        <li>Gym</li>
        <li>Music</li>

    </ul>

    <button type="button" id="addItem">Add Item</button>
    <button type="button"id="removeItem">Remove Item</button>
</body>
</html>
